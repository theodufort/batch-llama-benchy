[project]
name = "batch-bench-llama"
version = "0.1.0"
description = "Benchmark speculative decoding drafts with llama-benchy"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["requests>=2.31", "tabulate>=0.9"]

[project.scripts]
batch-bench-llama = "bench_llama.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_llama"]
